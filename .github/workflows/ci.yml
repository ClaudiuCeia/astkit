name: CI

on:
  push:
    branches:
      - main
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22.12.0", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Knip
        run: bun run knip

      - name: Dependency audit
        run: bun run audit

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Package check
        run: bun run pack:check

      - name: Node smoke test (astkit CLI)
        run: node packages/astkit/dist/cli.js --help

      - name: Node smoke test (astkit library import)
        run: node -e "import('./packages/astkit/dist/index.js').then(() => console.log('ok'))"

      - name: Node smoke test (workspace package imports)
        run: node -e "Promise.all(['astkit-core', 'nav', 'sgrep'].map((name) => import('./packages/' + name + '/dist/index.js'))).then(() => console.log('ok'))"

      - name: Node smoke test (spatch package import)
        run: node -e "import('@claudiu-ceia/spatch').then((m) => { if (typeof m.patchProject !== 'function') throw new Error('missing patchProject export'); console.log('ok'); })"

      - name: Node smoke test (spatch internal command subpath)
        run: node -e "import('@claudiu-ceia/spatch/internal/command').then((m) => { if (typeof m.patchCommand?.loader !== 'function') throw new Error('missing patchCommand export'); console.log('ok'); })"

      - name: Node smoke test (spatch CLI)
        run: node packages/spatch/dist/cli.js --help

      - name: Node smoke test (nav and sgrep CLIs)
        run: node packages/nav/dist/cli.js --help && node packages/sgrep/dist/cli.js --help

      - name: Test with coverage
        run: bun run test:coverage

  typescript-compatibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        typescript-version: ["5.9.3", "6.0.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - name: Install dependencies
        run: bun ci

      - name: Install TypeScript ${{ matrix.typescript-version }}
        run: bun add --no-save --exact typescript@${{ matrix.typescript-version }}

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: Compiler API tests
        run: bun test packages/nav/__tests__ packages/sgrep/__tests__
