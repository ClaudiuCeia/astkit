version: 2
updates:
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      development-dependencies:
        dependency-type: "development"
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
      - dependency-name: "@types/node"
        versions: [">=23"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
